# XcodeGen spec. Generate the Xcode project with:  cd app && xcodegen generate
name: Reel
options:
  bundleIdPrefix: community.reel
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
packages:
  # Playback engine: FFmpeg demux, VideoToolbox decode, Apple's own renderers (Atmos and other
  # multichannel audio reach iOS's spatial renderer; HDR10 / Dolby Vision; PiP). LGPL-3 with an
  # App Store exception. Pinned to the minor, as its author advises: it ships a prebuilt decode stack.
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    minorVersion: 7.70.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Reel:
    type: application
    platform: iOS
    sources:
      - path: Reel
      - path: Shared
    dependencies:
      - package: AetherEngine
        product: AetherEngine
      # Widgets and the download Live Activity.
      - target: ReelWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: community.reel.app
        # iPhone and iPad. No UIRequiresFullScreen: the app must resize freely (iPhone Duo,
        # iPad windows); that key is deprecated and ignored when built with the iOS 27 SDK.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
        # The app group the widgets read from. CI signs ad hoc with this file, so a sideloading
        # store sees the group and grants it when it signs the app for the device.
        CODE_SIGN_ENTITLEMENTS: Reel/Reel.entitlements
    scheme:
      testTargets:
        - ReelTests
    info:
      path: Reel/Info.plist
      properties:
        CFBundleDisplayName: Reel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Every orientation everywhere: on iPhone Duo's inner display and in iPad windows the
        # app is resized rather than rotated, and locks are treated as preferences anyway.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
          - fetch
        # The calendar refresh that keeps new-episode notifications current.
        BGTaskSchedulerPermittedIdentifiers:
          - community.reel.app.refresh
        # reel://title/tt0111161?type=movie opens a title.
        CFBundleURLTypes:
          - CFBundleURLName: community.reel.app
            CFBundleURLSchemes:
              - reel
        # Handoff of the title on screen between iPhone and iPad.
        NSUserActivityTypes:
          - community.reel.app.title
        # Debrid download links are HTTPS, but some providers hand out plain HTTP media links.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # Languages the String Catalog (Reel/Localizable.xcstrings) carries.
        CFBundleLocalizations: [en, zh-Hans, es, fr, de]
        CFBundleDevelopmentRegion: en
  # Logic tests: release parsing, ranking, the library's rules. Run in CI on a simulator.
  ReelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReelTests
    dependencies:
      - target: Reel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: community.reel.tests

  # Continue Watching and Next Episodes widgets, and the download Live Activity.
  ReelWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ReelWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: community.reel.app.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reel
        CODE_SIGN_ENTITLEMENTS: ReelWidgets/ReelWidgets.entitlements
        MARKETING_VERSION: $(MARKETING_VERSION)
        SKIP_INSTALL: YES
    info:
      path: ReelWidgets/Info.plist
      properties:
        CFBundleDisplayName: Reel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Apple TV: the same stores, services and screens as the iPhone app (Reel/), with tvOS branches
  # where the platform differs, a Siri Remote player and a Top Shelf in place of the widgets.
  ReelTV:
    type: application
    platform: tvOS
    sources:
      - path: Reel
        excludes:
          # tvOS needs a layered icon and Top Shelf images; ReelTV has its own catalogue.
          - "Assets.xcassets"
          - "Reel.entitlements"
          # The iPhone app's own plist; ReelTV has its own.
          - "Info.plist"
      - path: Shared
      - path: ReelTV
    dependencies:
      - package: AetherEngine
        product: AetherEngine
      - target: ReelTopShelf
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: community.reel.tv
        PRODUCT_NAME: Reel
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEAD_CODE_STRIPPING: YES
        CODE_SIGN_ENTITLEMENTS: ReelTV/ReelTV.entitlements
    # A shared scheme, so CI can build it with xcodebuild.
    scheme: {}
    info:
      path: ReelTV/Info.plist
      properties:
        CFBundleDisplayName: Reel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - community.reel.app.refresh
        CFBundleURLTypes:
          - CFBundleURLName: community.reel.tv
            CFBundleURLSchemes:
              - reel
        NSUserActivityTypes:
          - community.reel.app.title
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        # Settings → Back Up and Restore serves a page to a phone on the same network.
        NSLocalNetworkUsageDescription: Your phone connects to this Apple TV to save or restore a backup.
        CFBundleLocalizations: [en, zh-Hans, es, fr, de]
        CFBundleDevelopmentRegion: en

  # Continue Watching and the next episodes on the Apple TV Home Screen, from the same file the
  # iPhone widgets read.
  ReelTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: ReelTopShelf
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: community.reel.tv.topshelf
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ReelTV/ReelTV.entitlements
        MARKETING_VERSION: $(MARKETING_VERSION)
        SKIP_INSTALL: YES
        # TVServices predates Swift concurrency checking; the provider runs on its own queue.
        SWIFT_VERSION: "5.0"
    info:
      path: ReelTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Reel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
