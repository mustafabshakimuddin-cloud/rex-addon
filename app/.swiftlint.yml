# Lint for likely mistakes and consistency; the CI job reports, it never fails a build.
included:
  - Reel
  - ReelWidgets
  - ReelTests
  - Shared
disabled_rules:
  - todo
  - trailing_comma
  - nesting
  - large_tuple
  - type_body_length
  - function_body_length
  - multiple_closures_with_trailing_closure
  - for_where
  - opening_brace
opt_in_rules:
  - empty_count
  - first_where
  - contains_over_filter_count
  - redundant_nil_coalescing
line_length:
  warning: 160
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 900
identifier_name:
  min_length: 1
  max_length: 60
force_try: warning
cyclomatic_complexity:
  warning: 25
