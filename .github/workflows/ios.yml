name: iOS app

on:
  push:
    branches: [ main, "claude/**" ]
    paths: [ "app/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unsigned .ipa
    # GitHub-hosted image with Xcode 27.1 (iOS 27.1 SDK), which iPhone Duo support needs.
    runs-on: xcode-27
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # iPhone Duo support arrives with Xcode 27.1. Use the newest Xcode 27 on the runner and say
      # so loudly if there is none, rather than silently building with an older SDK.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::warning::No Xcode 27 on this runner; falling back to the newest Xcode (no iPhone Duo support)."
            XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # AetherEngine ships a prebuilt decode stack; fetching it on every push is most of the wait.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            app/build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-device-${{ hashFiles('app/project.yml') }}
          restore-keys: spm-device-

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Reel.xcodeproj \
            -scheme Reel \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="0.1.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee build.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      # Ship arm64 only, without bitcode: an embedded framework carrying 32-bit (armv7) or simulator
      # slices is rejected by sideloading signers and current iOS (VLCKit 3.6 shipped exactly that).
      - name: Package .ipa
        run: |
          rm -rf Payload Reel-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Reel.app Payload/
          for BIN in Payload/Reel.app/Frameworks/*.framework/*; do
            [ -f "$BIN" ] && file "$BIN" | grep -q "Mach-O" || continue
            if lipo -info "$BIN" | grep -qE "armv7|i386|x86_64"; then
              lipo "$BIN" -thin arm64 -output "$BIN.thin" && mv "$BIN.thin" "$BIN"
            fi
            if xcrun --find bitcode_strip >/dev/null 2>&1; then xcrun bitcode_strip -r "$BIN" -o "$BIN.nobc" && mv "$BIN.nobc" "$BIN"; fi
          done
          find Payload -name "*.dSYM" -prune -exec rm -rf {} +
          for BIN in Payload/Reel.app/Reel Payload/Reel.app/Frameworks/*.framework/*; do
            [ -f "$BIN" ] && file "$BIN" | grep -q "Mach-O" && lipo -info "$BIN"
          done
          for FW in Payload/Reel.app/Frameworks/*.framework; do
            BIN="$FW/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$FW/Info.plist" 2>/dev/null || basename "$FW" .framework)"
            [ -f "$BIN" ] || continue
            if lipo -info "$BIN" | grep -qE "armv7|i386|x86_64"; then
              echo "::error::$(basename "$FW") still contains code for another architecture"; exit 1
            fi
          done
          du -sh Payload/Reel.app/Frameworks/* | sort -h | tail -12
          # Plain zip (no symlink storage), Payload/ at the root, as installers expect.
          zip -qr Reel-unsigned.ipa Payload
          unzip -l Reel-unsigned.ipa | head -8
          ls -lh Reel-unsigned.ipa

      # Unsigned: install with AltStore or Sideloadly, which sign it with your Apple ID.
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Reel-unsigned-ipa
          path: app/Reel-unsigned.ipa
          retention-days: 30

  # Builds from main are also published to a rolling "latest" release, which gives the .ipa a
  # permanent direct link that needs no GitHub sign-in and opens straight in AltStore/Sideloadly:
  #   https://github.com/<owner>/rex-addon/releases/download/latest/Reel.ipa
  release:
    name: Publish the release and the SideStore source
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Reel-unsigned-ipa
      # Each build gets its own release (v0.1.N), which replaces the previous one, plus the rolling
      # "latest" release that holds only source.json.
      # SideStore / AltStore / Feather add the source by:
      #   https://github.com/<owner>/<repo>/releases/download/latest/source.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="0.1.$BUILD"
          TAG="v$VERSION"
          mv Reel-unsigned.ipa Reel.ipa
          SUMMARY=$(printf '%s\n' "$COMMIT_MESSAGE" | head -1)
          # Every change since the previous build, not just the last commit's first line.
          PREVIOUS=$(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          CHANGES=""
          if [ -n "$PREVIOUS" ] && git fetch --quiet --depth=300 origin "+refs/tags/$PREVIOUS:refs/tags/$PREVIOUS" "$GITHUB_SHA" 2>/dev/null; then
            CHANGES=$(git log --no-merges --format='- %s' "$PREVIOUS..$GITHUB_SHA" | grep -v '^- ci:' | head -40 || true)
          fi
          [ -z "$CHANGES" ] && CHANGES="- $SUMMARY"
          NOTES="$CHANGES"$'\n\n'"Unsigned build of ${GITHUB_SHA::7}. Install with SideStore, AltStore or Sideloadly."
          # Marked as GitHub's latest release, so .../releases/latest/download/Reel.ipa always
          # names the newest build.
          gh release create "$TAG" Reel.ipa --title "Reel $VERSION" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          # Only the newest build is kept: stores that list a repository's releases show every
          # one, and the source lists just this version, so older releases are deleted with
          # their tags once the new one is up.
          for OLD in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG"); do
            gh release delete "$OLD" --yes --cleanup-tag || true
          done
          rm -f previous.json
          gh release download latest -p source.json -O previous.json 2>/dev/null || true
          python3 app/tools/make_source.py --previous previous.json --out source.json \
            --version "$VERSION" --build "$BUILD" --ipa Reel.ipa \
            --download-url "https://github.com/$GH_REPO/releases/download/$TAG/Reel.ipa" --notes "$SUMMARY"
          LATEST_NOTES="The SideStore / AltStore source for Reel. Newest build: $VERSION."$'\n\n'"Add this source: https://github.com/$GH_REPO/releases/download/latest/source.json"$'\n\n'"The app itself is in each versioned release (v0.1.N)."
          # The "latest" tag holds only source.json. Stores that read a repository's releases
          # directly list every release with an .ipa, so a second copy here showed each build twice.
          if gh release view latest >/dev/null 2>&1; then
            gh release delete-asset latest Reel.ipa -y 2>/dev/null || true
            gh release upload latest source.json --clobber
            gh release edit latest --title "Reel source" --notes "$LATEST_NOTES" --prerelease
          else
            gh release create latest source.json --title "Reel source" --notes "$LATEST_NOTES" --prerelease --target "$GITHUB_SHA"
          fi

  # Launches the app in the iPhone Duo and iPhone 17 simulators and screenshots it, so a launch
  # crash or broken layout shows up here rather than on someone's phone. Screenshots are uploaded
  # and also printed (small JPEGs, base64) so they can be read from the log alone.
  simulator:
    name: Launch on simulators
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone (Duo|17 )" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            app/build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-sim-${{ hashFiles('app/project.yml') }}
          restore-keys: spm-sim-

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build -project Reel.xcodeproj -scheme Reel -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tee sim.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" sim.log

      - name: Run the tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys; d=json.load(sys.stdin)['devices']
          c=[(r,x['udid']) for r,l in d.items() for x in l if x['name'].startswith('iPhone 17')]
          print(sorted(c, reverse=True)[0][1] if c else '')")
          if [ -z "$UDID" ]; then echo "::warning::No iPhone 17 simulator; tests skipped"; exit 0; fi
          xcodebuild test -project Reel.xcodeproj -scheme Reel -destination "id=$UDID" -derivedDataPath build \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "error:|✘|✔ Test run|recorded an issue|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Launch and screenshot
        # About two minutes a screen across both simulators, plus booting and installing.
        timeout-minutes: 55
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Reel.app
          mkdir -p shots
          # perl's alarm stands in for coreutils timeout, which macOS lacks.
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          for NAME in "iPhone Duo" "iPhone 17"; do
            # Newest runtime first; a runner image can list a device whose runtime is not installed
            # ("The iOS 27.2 simulator runtime is not available"), so fall back to the next one.
            CANDIDATES=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys; d=json.load(sys.stdin)['devices']
          c=[(r,x['udid']) for r,l in d.items() for x in l if x['name']=='$NAME']
          print(' '.join(u for _,u in sorted(c, reverse=True)))")
            UDID=""
            for C in $CANDIDATES; do
              limit 240 xcrun simctl boot "$C" >/dev/null 2>&1 || true
              if limit 300 xcrun simctl bootstatus "$C" -b >/dev/null 2>&1; then UDID="$C"; break; fi
              echo "$NAME $C did not boot, trying the next runtime"
            done
            if [ -z "$UDID" ]; then echo "::warning::No bootable $NAME simulator on this runner"; continue; fi
            xcrun simctl list devices | grep "$UDID" || true
            # A Duo's first install can take several minutes.
            if ! limit 600 xcrun simctl install "$UDID" "$APP"; then echo "::warning::$NAME: install timed out"; continue; fi
            SLUG=$(echo "$NAME" | tr ' ' '-')
            # iPhone Duo has two displays (outer and inner); capture each one simctl lists.
            DISPLAYS=$(limit 30 xcrun simctl io "$UDID" screenshot /dev/null 2>&1 | grep -oE -- '--display=[0-9]+' || true)
            [ -z "$DISPLAYS" ] && DISPLAYS="default"
            FIRST=1
            # Every launch passes -ReelShot, which also keeps first-run setup from covering the
            # screen ("home" opens nothing else; "setup" shows setup itself).
            for SCREEN in home setup detail sources player movies calendar library settings status; do
              limit 30 xcrun simctl terminate "$UDID" community.reel.app >/dev/null 2>&1 || true
              limit 300 xcrun simctl launch "$UDID" community.reel.app -ReelShot "$SCREEN" || true
              if [ $FIRST = 1 ]; then sleep 45; FIRST=0; else sleep 14; fi
              # The check itself can be slow right after boot; only a list that came back without
              # the app means it isn't running.
              RUNNING=$(limit 60 xcrun simctl spawn "$UDID" launchctl list 2>/dev/null || echo "CHECK-TIMED-OUT")
              if [ "$RUNNING" = "CHECK-TIMED-OUT" ]; then
                echo "::warning::$NAME: couldn't check whether the app is running on the $SCREEN screen"
              elif ! printf '%s\n' "$RUNNING" | grep -q community.reel.app; then
                echo "::error::$NAME: the app is not running on the $SCREEN screen (crashed?)"
                limit 60 xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "Reel"' --style compact | tail -60 || true
              fi
              # A freshly booted Duo may not answer the display probe; ask again once it's up.
              if [ "$DISPLAYS" = "default" ]; then
                PROBE=$(limit 30 xcrun simctl io "$UDID" screenshot /dev/null 2>&1 | grep -oE -- '--display=[0-9]+' || true)
                [ -n "$PROBE" ] && DISPLAYS="$PROBE"
              fi
              for D in $DISPLAYS; do
                SHOT="$SLUG-$SCREEN${D#--display=}"; [ "$D" = "default" ] && SHOT="$SLUG-$SCREEN"
                if [ "$D" = "default" ]; then limit 30 xcrun simctl io "$UDID" screenshot "shots/$SHOT.png" || continue
                else limit 30 xcrun simctl io "$UDID" screenshot "$D" "shots/$SHOT.png" || continue; fi
                sips -Z 640 -s format jpeg -s formatOptions 55 "shots/$SHOT.png" --out "shots/$SHOT-small.jpg" >/dev/null
              done
            done
            limit 60 xcrun simctl shutdown "$UDID" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: app/shots/
          retention-days: 14
