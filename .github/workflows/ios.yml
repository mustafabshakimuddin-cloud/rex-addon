name: iOS app

on:
  push:
    branches: [ main, "claude/**" ]
    paths: [ "app/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unsigned .ipa
    # GitHub-hosted image with Xcode 27.1 (iOS 27.1 SDK), which iPhone Duo support needs.
    runs-on: xcode-27
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # iPhone Duo support arrives with Xcode 27.1. Use the newest Xcode 27 on the runner and say
      # so loudly if there is none, rather than silently building with an older SDK.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::warning::No Xcode 27 on this runner; falling back to the newest Xcode (no iPhone Duo support)."
            XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Reel.xcodeproj \
            -scheme Reel \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -80 || true

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Reel.app Payload/
          zip -qry Reel-unsigned.ipa Payload
          ls -lh Reel-unsigned.ipa

      # Unsigned: install with AltStore or Sideloadly, which sign it with your Apple ID.
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Reel-unsigned-ipa
          path: app/Reel-unsigned.ipa
          retention-days: 30

  # Launches the app in the iPhone Duo and iPhone 17 simulators and screenshots it, so a launch
  # crash or broken layout shows up here rather than on someone's phone. Screenshots are uploaded
  # and also printed (small JPEGs, base64) so they can be read from the log alone.
  simulator:
    name: Launch on simulators
    runs-on: xcode-27
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone (Duo|17 )" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build -project Reel.xcodeproj -scheme Reel -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tee sim.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" sim.log

      - name: Launch and screenshot
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Reel.app
          mkdir -p shots
          for NAME in "iPhone Duo" "iPhone 17"; do
            UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys; d=json.load(sys.stdin)['devices']
          c=[(r,x['udid']) for r,l in d.items() for x in l if x['name']=='$NAME']
          print(sorted(c)[-1][1] if c else '')")
            if [ -z "$UDID" ]; then echo "::warning::No $NAME simulator"; continue; fi
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" community.reel.app
            sleep 25
            SLUG=$(echo "$NAME" | tr ' ' '-')
            if ! xcrun simctl spawn "$UDID" launchctl list | grep -q community.reel.app; then
              echo "::error::$NAME: the app is not running 25 s after launch (crashed?)"
              xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "Reel"' --style compact | tail -60 || true
            fi
            xcrun simctl io "$UDID" screenshot "shots/$SLUG.png"
            sips -Z 640 -s format jpeg -s formatOptions 55 "shots/$SLUG.png" --out "shots/$SLUG-small.jpg" >/dev/null
            echo "=== SCREENSHOT $SLUG BEGIN ==="; base64 -i "shots/$SLUG-small.jpg"; echo "=== SCREENSHOT $SLUG END ==="
            xcrun simctl shutdown "$UDID" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: app/shots/
          retention-days: 14
